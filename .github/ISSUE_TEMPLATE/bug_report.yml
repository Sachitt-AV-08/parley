name: Bug report
description: Something broke. Include the reproduction — the `--demo` sim makes this easy.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Be kind; bugs are ours, not yours.
  - type: input
    id: version
    attributes:
      label: parley version
      description: `parley --version` (or the commit you're on).
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI
        - Python SDK
        - HTTP server
        - TUI
        - Demo simulator
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows/macOS/Linux, WhatsApp Desktop or browser tab, WhatsApp/WebView2 build if relevant.
  - type: input
    id: whatsapp_build
    attributes:
      label: WhatsApp Desktop build
      description: 'e.g. 2.30xx.x (from WhatsApp Desktop > Help > About). Required for live-attach bugs.'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please prefer a `parley --demo …` reproduction when possible.
      placeholder: |
        1. Run `parley --demo send --to Ava --text "x"`
        2. ...
        3. Error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output / logs
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Honest checks
      options:
        - label: I removed any phone numbers, names or tokens from the logs.
          required: true
        - label: I checked there isn't already an open issue about this.
          required: true