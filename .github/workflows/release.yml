name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --extra mcp --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest

  build-and-release:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != pyproject.toml version ($PY_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Build
        run: |
          uv build
          ls -la dist/

      - name: Verify wheel contents
        run: |
          for w in dist/*.whl; do
            echo "=== $w ==="
            unzip -l "$w" | head -30
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Parley ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## Parley ${{ github.ref_name }}

            ### Installation

            **From GitHub Release (recommended):**
            ```bash
            # Universal wheel (works on all Python 3.10+)
            pip install https://github.com/Sachitt-AV-08/parley/releases/download/${{ github.ref_name }}/parley_wa-${{ github.ref_name#v }}-py3-none-any.whl

            # With MCP extra
            pip install 'parley-wa[mcp] @ https://github.com/Sachitt-AV-08/parley/releases/download/${{ github.ref_name }}/parley_wa-${{ github.ref_name#v }}-py3-none-any.whl'
            ```

            **From Git (always latest):**
            ```bash
            pip install 'parley-wa[mcp]@git+https://github.com/Sachitt-AV-08/parley.git@${{ github.ref_name }}'
            uv pip install 'parley-wa[mcp]@git+https://github.com/Sachitt-AV-08/parley.git@${{ github.ref_name }}'
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/Sachitt-AV-08/parley/main/install.ps1 | iex
            ```

            **macOS / Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Sachitt-AV-08/parley/main/install.sh | sh
            ```

            ### Verification
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### Changes
            See commit history since last release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-install:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Download release wheel
        run: |
          WHEEL_URL="https://github.com/Sachitt-AV-08/parley/releases/download/${{ github.ref_name }}/parley_wa-${{ github.ref_name#v }}-py3-none-any.whl"
          curl -L -o parley_wa.whl "$WHEEL_URL"
          ls -la parley_wa.whl

      - name: Test wheel install
        run: |
          pip install "parley-wa[mcp] @ ./parley_wa.whl"
          parley --version
          parley doctor --help